{% extends 'musicforum/base.html' %}

{% block content %}
    <h2>Восстановление пароля</h2>

    <form class="editor-form" method="post">
        {% csrf_token %}

        {% for f in form %}
            <div class="form-field">
                <label class="field-label" for="{{ f.id_for_label }}">{{ f.label }}:</label>
                {{ f }}
                <div class="form-error">{{ f.errors }}</div>
            </div>
        {% endfor %}

        <div class="button-row">
            <button class="button" type="submit">Сбросить по E-mail</button>
        </div>
    </form>
{% endblock %}
